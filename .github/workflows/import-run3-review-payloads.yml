name: Import pinned Run-3 review payloads
on:
  push:
    branches: ['review/run3-jec-id-qa-20261108']
    paths: ['.github/workflows/import-run3-review-payloads.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'JesusVlz/energyEnergyCorrelatorAnalysis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/run3-jec-id-qa-20261108
      - name: Retrieve and verify the four pinned payloads
        run: |
          python3 validation/run3Jets/sync_review_payloads.py --fetch
          python3 validation/run3Jets/sync_review_payloads.py
          python3 -m py_compile validation/run3Jets/sync_review_payloads.py
      - name: Commit verified bytes to the review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jetEnergyCorrections/run3/HIN-Jets_c64293a/*.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize requested Run-3 payloads byte-for-byte with pinned HIN-Jets source'
            git push origin HEAD:refs/heads/review/run3-jec-id-qa-20261108
          fi
