name: Checked Run-3 main integration
on:
  push:
    branches: [oo-integration]
    paths:
      - '.github/workflows/run3-main-integration.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: checked-run3-main-integration
  cancel-in-progress: false
jobs:
  checked-update:
    if: github.ref == 'refs/heads/oo-integration'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/run3-main-mpl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and apply the reviewed patch
        run: |
          set -euo pipefail
          mkdir -p /tmp/run3-evidence
          cat integration-staging/part{0,1,2,3,4,5,6}.patch > /tmp/main-update.patch
          echo '9541e69776d3c2a92a387c573f962bb362cc338f848d787fee3fa7602b136cb4  /tmp/main-update.patch' | sha256sum -c -
          git apply --check /tmp/main-update.patch
          git apply /tmp/main-update.patch
          git diff --check
      - name: Install pinned ROOT software-test environment
        run: |
          set -euo pipefail
          python -m pip install 'ROOT==0.1a10' numpy matplotlib
          python - <<'PY'
          import os, pathlib, ROOT
          root = pathlib.Path(ROOT.__file__).resolve().parent
          link = root / 'mock_site_packages' / 'ROOT'
          link.parent.mkdir(exist_ok=True)
          if not link.exists(): link.symlink_to(root, target_is_directory=True)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('ROOTSYS=' + str(root) + '\n')
              out.write('LD_LIBRARY_PATH=' + str(root / 'lib') + ':' + str(root.parent / 'root.libs') + ':' + os.environ.get('LD_LIBRARY_PATH', '') + '\n')
          with open(os.environ['GITHUB_PATH'], 'a') as out: out.write(str(root / 'bin') + '\n')
          pathlib.Path('/tmp/run3-evidence/root_version.txt').write_text(ROOT.gROOT.GetVersion() + '\n')
          PY
      - name: Run checked integration commands
        run: bash validation/run3Integration/checkMainUpdate.sh
      - name: Commit checked files to existing integration branch
        run: |
          set -euo pipefail
          git fetch origin oo-integration
          test "$(git rev-parse origin/oo-integration)" = "$GITHUB_SHA"
          git diff --check
          python validation/run3Integration/checkMainUpdatePaths.py
          git add -u
          git add cards/R4 plotting/deriveMonteCarloWeightsRun3.C plotting/deriveMonteCarloWeightsRun2.C plotting/README_Run3MCWeights.md validation/run3Integration/OverallCoordination.md validation/run3Integration/checkMainUpdate.sh validation/run3Integration/checkMainUpdatePaths.py validation/run3Integration/checkSlimTrackCards.py validation/run3Integration/testSlimTrackPolicy.cxx
          git add -f plotting/testDeriveMonteCarloWeightsRun3.C
          git rm integration-staging/part{0,1,2,3,4,5,6}.patch .github/workflows/run3-main-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat > /tmp/run3-evidence/change-stat.txt
          git commit -m 'Integrate Run-3 slim-track policy, R4 catalog, and MC-weight plots'
          git rev-parse HEAD > /tmp/run3-evidence/checked_commit.txt
          git archive --format=tar.gz HEAD > /tmp/run3-evidence/checked-source.tar.gz
          git push origin HEAD:oo-integration
          git status --short > /tmp/run3-evidence/worktree-status.txt
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run3-main-evidence-${{ github.sha }}
          path: /tmp/run3-evidence
          if-no-files-found: warn
          retention-days: 14
