name: Prepare Run3 closure validation runtime
on:
  push:
    branches: [run3-legacy-closure-plots]
    paths: [.github/workflows/run3-closure-runtime.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package unchanged source and official ROOT binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          git archive --format=tar.gz HEAD plotting src > bundle/analysis-source.tar.gz
          curl --fail --location --retry 2 --max-time 300 \
            https://root.cern/download/root_v6.40.04.Linux-debian13-x86_64-gcc14.2.tar.gz \
            --output bundle/root-debian13.tar.gz
          sha256sum bundle/*.tar.gz > bundle/SHA256SUMS.txt
          git rev-parse HEAD > bundle/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: run3-closure-runtime
          path: bundle/
          compression-level: 0
          retention-days: 1
