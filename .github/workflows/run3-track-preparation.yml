name: Run-3 track preparation
on:
  push:
    branches: [repair/run3-track-pair-preparation]
    paths:
      - 'validation/run3Pairs/*.py'
      - 'src/**'
      - '.github/workflows/run3-track-preparation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: run3-track-preparation
  cancel-in-progress: true
jobs:
  preparation:
    if: github.ref == 'refs/heads/repair/run3-track-pair-preparation'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check preparation files are present
        id: ready
        shell: bash
        run: |
          if test -f validation/run3Pairs/bootstrap_apply.py && test -f validation/run3Pairs/test_run3_preparation.py && test -f validation/run3Pairs/prepare_inputs.py; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Preparation upload incomplete; no source changes or tests performed.'
          fi
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.ready == 'true'
        with:
          python-version: '3.11'
      - name: Apply revision-checked source repair
        if: steps.ready.outputs.ready == 'true'
        run: python validation/run3Pairs/bootstrap_apply.py
      - name: Install ROOT for software tests only
        if: steps.ready.outputs.ready == 'true'
        run: |
          python -m pip install 'ROOT==0.1a10'
          python - <<'PY'
          import os, pathlib, ROOT
          root = pathlib.Path(ROOT.__file__).resolve().parent
          # Resolve the wheel's build-time relocation prefix for CI only.
          link = root / 'mock_site_packages' / 'ROOT'
          link.parent.mkdir(exist_ok=True)
          if not link.exists():
              link.symlink_to(root, target_is_directory=True)
          print('ROOT', ROOT.gROOT.GetVersion(), 'at', root)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('ROOTSYS=' + str(root) + '\n')
              out.write('LD_LIBRARY_PATH=' + str(root / 'lib') + ':' + str(root.parent / 'root.libs') + ':' + os.environ.get('LD_LIBRARY_PATH', '') + '\n')
          with open(os.environ['GITHUB_PATH'], 'a') as out:
              out.write(str(root / 'bin') + '\n')
          PY
      - name: Build analyzer and run software regression tests
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/run3-preparation
          make -j2 2>&1 | tee /tmp/run3-preparation/build.log
          python -m unittest discover -s validation/run3Pairs -p 'test_*.py' -v 2>&1 | tee /tmp/run3-preparation/tests.log
          python validation/run3Pairs/prepare_inputs.py audit-tables --output /tmp/run3-preparation/tracking_tables.json
          git diff --check
          git diff > /tmp/run3-preparation/source_repair.diff
      - name: Commit tested repair without overwriting concurrent work
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repair/run3-track-pair-preparation
          if test "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA"; then
            echo 'Repair branch advanced during validation; no rebase or force-push of untested changes.'
            exit 1
          fi
          git add src Makefile cardEECOO*.input cardEECpp5v36TeV*.input validation/run3Pairs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Repair Run-3 track selections, payload routing and pair preparation'
            git push origin HEAD:repair/run3-track-pair-preparation
          fi
          git rev-parse HEAD > /tmp/run3-preparation/validated_commit.txt
      - name: Upload technical evidence
        if: always() && steps.ready.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: run3-track-preparation-audit
          path: /tmp/run3-preparation
          if-no-files-found: warn
