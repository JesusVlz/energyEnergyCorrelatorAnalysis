name: Run-3 track preparation
on:
  push:
    branches: [repair/run3-track-pair-preparation]
    paths:
      - 'validation/run3Pairs/bootstrap_apply.py'
      - 'validation/run3Pairs/test_run3_preparation.py'
      - 'src/Run3TrackSelection.h'
      - 'src/Run3TrackCharge.h'
      - 'src/TrackingTableValidation.h'
      - '.github/workflows/run3-track-preparation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparation:
    if: github.ref == 'refs/heads/repair/run3-track-pair-preparation'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check preparation files are present
        id: ready
        shell: bash
        run: |
          if test -f validation/run3Pairs/bootstrap_apply.py && test -f validation/run3Pairs/test_run3_preparation.py && test -f src/Run3TrackSelection.h; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Preparation upload not complete; no source changes or tests performed.'
          fi
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.ready == 'true'
        with:
          python-version: '3.11'
      - name: Apply revision-checked source repair
        if: steps.ready.outputs.ready == 'true'
        run: python validation/run3Pairs/bootstrap_apply.py
      - name: Install ROOT for software tests only
        if: steps.ready.outputs.ready == 'true'
        run: |
          python -m pip install 'ROOT==0.1a10'
          python - <<'PY'
          import pathlib, ROOT
          root = pathlib.Path(ROOT.__file__).resolve().parent
          print('ROOT', ROOT.gROOT.GetVersion(), 'at', root)
          with open(__import__('os').environ['GITHUB_ENV'], 'a') as out:
              out.write('ROOTSYS=' + str(root) + '\n')
              out.write('LD_LIBRARY_PATH=' + str(root / 'lib') + '\n')
          with open(__import__('os').environ['GITHUB_PATH'], 'a') as out:
              out.write(str(root / 'bin') + '\n')
          PY
      - name: Build analyzer and run software regression tests
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          make -j2
          python -m unittest discover -s validation/run3Pairs -p 'test_*.py' -v
          python validation/run3Pairs/prepare_inputs.py audit-tables --output /tmp/run3-tracking-table-audit.json
          git diff --check
      - name: Commit only repaired source and configuration to this branch
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add src Makefile cardEECOO*.input cardEECpp5v36TeV*.input validation/run3Pairs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Repair Run-3 track selections, payload routing and pair preparation'
            git push origin HEAD:repair/run3-track-pair-preparation
          fi
      - name: Upload technical table audit
        if: always() && steps.ready.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: run3-track-preparation-audit
          path: /tmp/run3-tracking-table-audit.json
          if-no-files-found: warn
