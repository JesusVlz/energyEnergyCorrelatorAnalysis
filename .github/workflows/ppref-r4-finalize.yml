name: Finalize readable ppRef R4 installation source
on:
  push:
    branches: [install/ppref-r4-pairs-20261119]
    paths: [.github/workflows/ppref-r4-finalize.yml]
permissions:
  contents: read
jobs:
  finalize:
    if: github.ref == 'refs/heads/install/ppref-r4-pairs-20261119'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate readable cards and relocate R8 without modifying payloads
        run: python cards/prepare_ppref_pair_installation.py
      - name: Install ROOT for software tests
        run: |
          python -m pip install 'ROOT==0.1a10'
          python - <<'PY'
          import os, pathlib, ROOT
          root=pathlib.Path(ROOT.__file__).resolve().parent
          link=root/'mock_site_packages'/'ROOT';link.parent.mkdir(exist_ok=True)
          if not link.exists(): link.symlink_to(root,target_is_directory=True)
          with open(os.environ['GITHUB_PATH'],'a') as out: out.write(str(root/'bin')+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('LD_LIBRARY_PATH='+str(root/'lib')+':'+str(root.parent/'root.libs')+':'+os.environ.get('LD_LIBRARY_PATH','')+'\n')
          PY
      - name: Build and validate software and cards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ppref-install-checks
          make -j2 2>&1 | tee /tmp/ppref-install-checks/build.log
          python -m unittest discover -s validation/run3Pairs -p 'test_*.py' -v 2>&1 | tee /tmp/ppref-install-checks/tests.log
          python cards/build_r4_catalog.py --check
          python validation/run3Workflow/check_cards.py
          python validation/run3Integration/checkSlimTrackCards.py
          git diff --check
      - name: Commit generated source only on the checked installation branch
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin refs/heads/install/ppref-r4-pairs-20261119 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git add -A -- cards README.md validation/run3Workflow cardEECOOInclusiveR08.input cardEECOOMCInclusiveR08.input cardEECpp5v36TeVR08.input cardEECpp5v36TeVMCR08.input
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Generate JetID-on ppRef R4 application cards and relocate deferred R8 cards'
            git push origin HEAD:install/ppref-r4-pairs-20261119
          fi
          git rev-parse HEAD > /tmp/ppref-install-checks/tested_commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppref-r4-installation-software-checks
          path: /tmp/ppref-install-checks
