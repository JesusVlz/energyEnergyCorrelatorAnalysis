name: OO jet pT selection counts plot

on:
  push:
    branches:
      - review/run3-jec-id-qa-20261108
    paths:
      - ".github/workflows/oo-selection-count-plot.yml"

permissions:
  contents: read

jobs:
  plot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ROOT
        run: |
          python -m pip install --upgrade pip
          python -m pip install ROOT==0.1a12
          python - <<'PY'
          import ROOT, pathlib, os
          root = pathlib.Path(ROOT.__file__).resolve().parent
          with open(os.environ["GITHUB_PATH"],"a") as out:
              out.write(str(root/"bin")+"\n")
          with open(os.environ["GITHUB_ENV"],"a") as out:
              out.write("ROOTSYS="+str(root)+"\n")
              out.write("LD_LIBRARY_PATH="+str(root/"lib")+"\n")
          mock=root/"mock_site_packages"
          mock.mkdir(exist_ok=True)
          link=mock/"ROOT"
          if not link.exists():
              link.symlink_to(root,target_is_directory=True)
          PY

      - name: Build framework
        run: make -j2

      - name: Download OO CERNBox sample
        run: |
          mkdir -p selection_count_plot
          curl -fsSL --retry 3 --retry-delay 3             -o selection_count_plot/oo_data.root             "https://cernbox.cern.ch/s/8ijuBlE4H95W9kv/download"

      - name: Prepare bounded OO card
        run: |
          cp cardEECOOInclusiveR04.input selection_count_plot/OO_data_test.input
          python - <<'PY'
          from pathlib import Path
          p=Path("selection_count_plot/OO_data_test.input")
          s=p.read_text()
          for old,new in {
            "FilledHistograms 31":"FilledHistograms 3",
            "BackgroundMethods 6":"BackgroundMethods 0",
            "DebugLevel 2":"DebugLevel 0",
            "MaxEventsPerFile 0":"MaxEventsPerFile 20000",
          }.items():
              if old not in s:
                  raise SystemExit("Missing card token: "+old)
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Run OO data
        run: |
          ./eecAnalysis             selection_count_plot/oo_data.root             selection_count_plot/OO_data_test.input             selection_count_plot/oo_output.root             0 true             > selection_count_plot/eecAnalysis.log 2>&1

      - name: Draw jet pT selection plot with counts
        run: |
          cat > selection_count_plot/plot_selection_counts.C <<'EOF'
          {
            gStyle->SetOptStat(0);
            TFile f("selection_count_plot/oo_output.root","READ");
            auto *h=(TH3D*)f.Get("run3JetQA/selectionPtWeighted");
            auto *hc=(TH3D*)f.Get("run3JetQA/selectionPtCounts");
            if(!h || !hc) { std::cerr<<"Missing Run3 jet QA histograms"<<std::endl; gSystem->Exit(2); }

            const int stages[] = {0,1,3,5};
            const char *labels[] = {
              "No jet-quality selection",
              "trackMax/rawPt",
              "trackMax/rawPt + Jet ID",
              "trackMax/rawPt + Jet ID + veto"
            };
            const int colors[] = {1,2,4,8};
            const int styles[] = {1,2,3,4};

            TCanvas c("c","",950,800);
            c.SetLogy();
            c.SetLeftMargin(0.13);
            c.SetBottomMargin(0.12);
            TLegend leg(0.42,0.64,0.88,0.88);
            leg.SetBorderSize(0);
            leg.SetTextSize(0.030);

            std::vector<TH1D*> spectra;
            double ymax=0;
            for(int i=0;i<4;++i){
              int ybin=stages[i]+1;
              auto *p=h->ProjectionX(Form("p%d",i),ybin,ybin,1,h->GetNbinsZ(),"e");
              p->SetDirectory(nullptr);
              p->Rebin(5);
              p->Scale(1.0,"width");
              p->SetLineColor(colors[i]);
              p->SetLineStyle(styles[i]);
              p->SetLineWidth(3);
              p->SetMarkerColor(colors[i]);
              p->SetTitle("");
              p->GetXaxis()->SetTitle("Jet p_{T} (GeV)");
              p->GetYaxis()->SetTitle("Jets / GeV");
              p->GetXaxis()->SetRangeUser(0,220);
              p->SetMinimum(5e-3);
              ymax=std::max(ymax,p->GetMaximum());

              double count=hc->Integral(1,hc->GetNbinsX(),ybin,ybin,1,hc->GetNbinsZ());
              leg.AddEntry(p,Form("%s  (N = %.0f)",labels[i],count),"l");
              spectra.push_back(p);
            }
            spectra[0]->SetMaximum(ymax*8.0);
            spectra[0]->Draw("HIST");
            for(size_t i=1;i<spectra.size();++i) spectra[i]->Draw("HIST SAME");
            leg.Draw();

            TLatex latex;
            latex.SetNDC();
            latex.SetTextFont(42);
            latex.SetTextSize(0.037);
            latex.DrawLatex(0.14,0.93,"OO data 2025, #sqrt{s_{NN}} = 5.36 TeV");
            latex.SetTextSize(0.030);
            latex.DrawLatex(0.14,0.885,"20k-event validation sample; common event exposure");

            c.SaveAs("selection_count_plot/OO_jetPt_selection_counts.png");

            std::ofstream out("selection_count_plot/counts.txt");
            for(int i=0;i<4;++i){
              int ybin=stages[i]+1;
              double count=hc->Integral(1,hc->GetNbinsX(),ybin,ybin,1,hc->GetNbinsZ());
              out << labels[i] << " " << count << "\n";
            }
          }
          EOF
          root -l -b -q selection_count_plot/plot_selection_counts.C

      - name: Upload plot
        uses: actions/upload-artifact@v4
        with:
          name: oo-jetpt-selection-counts
          path: |
            selection_count_plot/OO_jetPt_selection_counts.png
            selection_count_plot/counts.txt
            selection_count_plot/eecAnalysis.log
          retention-days: 7
