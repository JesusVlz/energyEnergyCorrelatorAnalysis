name: Prepare ROOT dependency
on:
  push:
    branches: [run3-legacy-closure-plots]
    paths: [.github/workflows/run3-closure-dependencies.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download Debian 13 runtime dependency
        run: |
          mkdir -p deps
          docker run --rm -v "$PWD/deps:/out" debian:13-slim sh -c 'apt-get update -qq && cd /out && apt-get download libtbb12 libtbbmalloc2 libtbbbind-2-5 libhwloc15'
      - uses: actions/upload-artifact@v4
        with:
          name: run3-root-dependencies
          path: deps/
          retention-days: 1
