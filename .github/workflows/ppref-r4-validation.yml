name: ppRef R4 installation checks
on:
  push:
    branches: [main]
    paths:
      - 'cards/**'
      - 'trackCorrectionTables/pp2024/**'
      - 'validation/run3Pairs/**'
      - '.github/workflows/ppref-r4-validation.yml'
  pull_request:
    paths:
      - 'cards/**'
      - 'trackCorrectionTables/pp2024/**'
      - 'validation/run3Pairs/**'
      - '.github/workflows/ppref-r4-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ROOT for software tests only
        run: |
          python -m pip install 'ROOT==0.1a10'
          python - <<'PY'
          import os, pathlib, ROOT
          root=pathlib.Path(ROOT.__file__).resolve().parent
          link=root/'mock_site_packages'/'ROOT';link.parent.mkdir(exist_ok=True)
          if not link.exists(): link.symlink_to(root,target_is_directory=True)
          with open(os.environ['GITHUB_PATH'],'a') as out: out.write(str(root/'bin')+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('LD_LIBRARY_PATH='+str(root/'lib')+':'+str(root.parent/'root.libs')+':'+os.environ.get('LD_LIBRARY_PATH','')+'\n')
          PY
      - name: Build and check source and cards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ppref-checks
          make -j2 2>&1 | tee /tmp/ppref-checks/build.log
          python -m unittest discover -s validation/run3Pairs -p 'test_*.py' -v 2>&1 | tee /tmp/ppref-checks/tests.log
          python cards/build_r4_catalog.py --check
          python cards/prepare_ppref_pair_installation.py
          git diff --exit-code
          python validation/run3Workflow/check_cards.py
          python validation/run3Integration/checkSlimTrackCards.py
      - name: Report actual binary installation status
        shell: bash
        run: |
          set -euo pipefail
          count=$(find trackCorrectionTables/pp2024/pair/20261116 -name '*.root' -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo 'NOT_INSTALLED: three original ROOT payloads still require the checked local installation.' | tee /tmp/ppref-checks/payload_status.txt
          elif [ "$count" -ne 3 ]; then
            echo 'ERROR: partial ROOT payload installation' >&2
            exit 1
          else
            python cards/install_ppref_pair_tables.py --check | tee /tmp/ppref-checks/payload_status.txt
            g++ -std=c++17 $(root-config --cflags) -Isrc validation/run3Pairs/check_pp2024_installed_tables.cxx src/TrackPairEfficiencyCorrector.cxx src/BinningCard.cxx $(root-config --libs) -o /tmp/ppref-checks/check_tables
            for selection in Nominal Loose Tight; do
              /tmp/ppref-checks/check_tables "trackCorrectionTables/pp2024/pair/20261116/$selection/trackPairEfficiencyCorrection_pp_run3-an751-v6-32dr-lowpt.root" | tee -a /tmp/ppref-checks/lookups.log
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppref-r4-installation-checks
          path: /tmp/ppref-checks
